kind = "web"
previewPath = "/"
title = "Inventário em Tempo Real"
version = "1.0.0"
id = "artifacts/inventory-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24449

[services.development]
run = "pnpm --filter @workspace/inventory-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/inventory-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/inventory-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24449"
BASE_PATH = "/"
